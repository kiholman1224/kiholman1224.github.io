<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">

        <link rel="icon" type="image/x-icon" href="Project4/img/favicon.ico">

    <body>
        <a href="#main-content" class="skip-link">Skip to main content</a>

                <figure>
                    <img src="img/solarsystem.jpg" alt="The sun and the eight planets lined up in order of distance from the sun." width="1200" height="600">

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password">

            </section>
