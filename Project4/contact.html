            <section class="intro" aria-labelledby="page-heading">
                <h2 id="page-heading">Contact Us</h2>
                <p class="lead">Is there something you think should be changed or improved? I'd love to hear from you!</p>
            </section>

            <section class="contact-form" aria-labelledby="form-heading">
                <h2 id="form-heading">Send a Message</h2>
                <form action="#" method="post">
                    <label for="contact-name">Name</label>
                    <input type="text" id="contact-name" name="name" autocomplete="name" required>

                    <label for="contact-email">Email</label>
                    <input type="email" id="contact-email" name="email" autocomplete="email" required>

                    <label for="contact-message">Message</label>
                    <textarea id="contact-message" name="message" rows="6" required></textarea>

                    <button type="submit">Send Message</button>
                </form>
            </section>
        </main>
